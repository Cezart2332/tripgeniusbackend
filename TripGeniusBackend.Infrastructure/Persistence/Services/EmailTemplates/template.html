    }

      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .cta-button a {
      box-shadow: 0 8px 20px rgba(65, 162, 56, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-button a:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(65, 162, 56, 0.35);

<body style="word-spacing:normal;background-color:#0d0f0d;">
  <div aria-roledescription="email" role="article" lang="und" dir="auto" style="word-spacing:normal;background-color:#0d0f0d;">
    <!-- Header Logo -->
    <!--[if mso | IE]><table align="center" border="0" cellpadding="0" cellspacing="0" class="" role="presentation" style="width:600px;" width="600" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->
    <div style="margin:0px auto;max-width:600px;">
      <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;">
        <tbody>
          <tr>
            <td style="direction:ltr;font-size:0px;padding:48px 20px 24px 20px;text-align:center;">
              <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tr><td class="" style="vertical-align:top;width:560px;" ><![endif]-->
              <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%;">
                <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top;" width="100%">
                  <tbody>
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">
                        <div style="font-family:Lexend, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;letter-spacing:3px;line-height:24px;text-align:center;color:#f3fff1;">TRIPGENIUS</div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <!--[if mso | IE]></td></tr></table><![endif]-->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!--[if mso | IE]></td></tr></table><![endif]-->
    <!-- Main Content Card -->
    <!--[if mso | IE]><table align="center" border="0" cellpadding="0" cellspacing="0" class="email-card-outlook" role="presentation" style="width:600px;" width="600" bgcolor="#161e16" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->
    <div class="email-card" style="background:#161e16;background-color:#161e16;margin:0px auto;max-width:600px;border-radius:20px;overflow:hidden;">
      <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background:#161e16;background-color:#161e16;width:100%;border-collapse:separate;">
        <tbody>
          <tr>
            <td style="border:1px solid #2a4029;border-radius:20px;direction:ltr;font-size:0px;padding:44px 36px;text-align:center;">
              <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tr><td class="" style="vertical-align:top;width:526px;" ><![endif]-->
              <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%;">
                <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top;" width="100%">
                  <tbody>
                    <!-- Dynamic Header/Subject -->
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;padding-bottom:16px;word-break:break-word;">
                        <div style="font-family:Lexend, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:24px;font-weight:600;line-height:32px;text-align:center;color:#f3fff1;">{subject}</div>
                      </td>
                    </tr>
                    <!-- Elegant divider line -->
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;padding-bottom:24px;word-break:break-word;">
                        <p style="border-top:solid 1px rgba(65, 162, 56, 0.24);font-size:1px;margin:0px auto;width:60px;">
                        </p>
                        <!--[if mso | IE]><table align="center" border="0" cellpadding="0" cellspacing="0" style="border-top:solid 1px rgba(65, 162, 56, 0.24);font-size:1px;margin:0px auto;width:60px;" role="presentation" width="60px" ><tr><td style="height:0;line-height:0;"> &nbsp;
</td></tr></table><![endif]-->
                      </td>
                    </tr>
                    <!-- Dynamic Body Text -->
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;padding-bottom:32px;word-break:break-word;">
                        <div style="font-family:Lexend, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;line-height:26px;text-align:center;color:#d3edcf;">{content}</div>
                      </td>
                    </tr>
                    <!-- Dynamic CTA Button -->
                    <tr>
                      <td align="center" class="cta-button" style="font-size:0px;padding:10px 25px;padding-bottom:32px;word-break:break-word;">
                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:separate;line-height:100%;">
                          <tbody>
                            <tr>
                              <td align="center" bgcolor="#41a238" role="presentation" style="border:none;border-radius:99px;cursor:auto;mso-padding-alt:14px 40px;background:#41a238;" valign="middle">
                                <a href="{actionUrl}" style="display:inline-block;background:#41a238;color:#042116;font-family:Lexend, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;line-height:120%;margin:0;text-decoration:none;text-transform:none;padding:14px 40px;mso-padding-alt:0px;border-radius:99px;" target="_blank"> {actionLabel} </a>
                              </td>
                            </tr>
                          </tbody>
                        </table>
                      </td>
                    </tr>
                    <!-- Fallback section -->
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;padding-top:8px;padding-bottom:24px;word-break:break-word;">
                        <p style="border-top:solid 1px rgba(65, 162, 56, 0.15);font-size:1px;margin:0px auto;width:100%;">
                        </p>
                        <!--[if mso | IE]><table align="center" border="0" cellpadding="0" cellspacing="0" style="border-top:solid 1px rgba(65, 162, 56, 0.15);font-size:1px;margin:0px auto;width:476px;" role="presentation" width="476px" ><tr><td style="height:0;line-height:0;"> &nbsp;
</td></tr></table><![endif]-->
                      </td>
                    </tr>
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">
                        <div style="font-family:Lexend, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;text-align:center;color:#a9c8a3;">If the button doesn't work, copy and paste this URL into your browser:</div>
                      </td>
                    </tr>
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;padding-top:8px;word-break:break-word;">
                        <div style="font-family:Lexend, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;text-align:center;color:#d3edcf;"><a href="{actionUrl}" style="color: #17f702; text-decoration: none; word-break: break-all;">{actionUrl}</a></div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <!--[if mso | IE]></td></tr></table><![endif]-->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!--[if mso | IE]></td></tr></table><![endif]-->
    <!-- Footer Section -->
    <!--[if mso | IE]><table align="center" border="0" cellpadding="0" cellspacing="0" class="" role="presentation" style="width:600px;" width="600" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->
    <div style="margin:0px auto;max-width:600px;">
      <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;">
        <tbody>
          <tr>
            <td style="direction:ltr;font-size:0px;padding:32px 20px 48px 20px;text-align:center;">
              <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tr><td class="" style="vertical-align:top;width:560px;" ><![endif]-->
              <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%;">
                <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top;" width="100%">
                  <tbody>
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;padding-bottom:8px;word-break:break-word;">
                        <div style="font-family:Lexend, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;text-align:center;color:#a9c8a3;">© 2026 TripGenius. All rights reserved.</div>
                      </td>
                    </tr>
                    <tr>
                      <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">
                        <div style="font-family:Lexend, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;text-align:center;color:#a9c8a3;"><a href="#" class="footer-link" style="margin-right: 8px;">Unsubscribe</a>
                          <span style="color: rgba(65, 162, 56, 0.4);">•</span>
                          <a href="#" class="footer-link" style="margin-left: 8px;">Privacy Policy</a>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <!--[if mso | IE]></td></tr></table><![endif]-->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!--[if mso | IE]></td></tr></table><![endif]-->
  </div>
</body>

</html>
