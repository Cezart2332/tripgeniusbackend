services:
  moderation:
    build:
      context: ../tripgeniusimagechecker
      dockerfile: Dockerfile
    container_name: tripgenius-moderation
    restart: always
    mem_limit: 2560m
    expose:
      - "8000"
    environment:
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=2
      - NSFW_THRESHOLD=0.5
      - TOXIC_THRESHOLD=0.72
      - SHORT_TEXT_TOXIC_THRESHOLD=0.88
      - TOXIC_LABELS=toxic,severe_toxic,obscene,threat,insult,identity_hate
      - LOG_LEVEL=INFO
      - MODERATION_LOG_PREVIEW=true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=15) as r:
              b = json.load(r)
          sys.exit(0 if b.get("image_ready") and b.get("text_ready") else 1)
      interval: 15s
      timeout: 20s
      retries: 8
      start_period: 240s

  frontend:
    build:
      context: ../tripgeniusfrontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_OPEN_TRIP_MAP: ${VITE_OPEN_TRIP_MAP}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
    container_name: tripgenius-frontend
    restart: always
    # Container listens on 80. Do not publish host :80 when Coolify/Traefik already uses it.
    expose:
      - "80"
    # Local access without a reverse proxy: set FRONTEND_PUBLISH_PORT=8080 in .env and uncomment:
    # ports:
    #   - "${FRONTEND_PUBLISH_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripgenius-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - 'ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}'
      - 'Jwt__Key=${JWT_KEY}'
      - 'Jwt__Issuer=${JWT_ISSUER:-TripGenius}'
      - 'Jwt__Audience=${JWT_AUDIENCE:-TripGenius}'
      - 'Jwt__AccessTokenExpiryMinutes=${JWT_ACCESS_TOKEN_EXPIRY:-30}'
      - 'Jwt__RefreshTokenExpiryDays=${JWT_REFRESH_TOKEN_EXPIRY:-7}'
      - 'Email__ResendApiKey=${RESEND_API_KEY}'
      - 'Google__ClientId=${GOOGLE_CLIENT_ID}'
      - 'OpenRouter__ApiKey=${OPENROUTER_API_KEY}'
      - 'Vapid__PublicKey=${VAPID_PUBLIC_KEY}'
      - 'Vapid__PrivateKey=${VAPID_PRIVATE_KEY}'
      - 'Vapid__Subject=${VAPID_SUBJECT}'
      - 'OpenTripMap__ApiKey=${OPENTRIPMAP_API_KEY}'
      - 'Cors__AllowedOrigins__0=${FRONTEND_URL:-https://tripgenius.online}'
      - 'Cors__AllowedOrigins__1=${FRONTEND_URL_WWW:-https://www.tripgenius.online}'
      - 'UPLOADS_PATH=${UPLOADS_PATH:-/app/wwwroot}'
      - 'Moderation__BaseUrl=http://moderation:8000'
      - 'Moderation__Enabled=${MODERATION_ENABLED:-true}'
      - 'Moderation__TimeoutSeconds=${MODERATION_TIMEOUT_SECONDS:-30}'
      - 'Moderation__FailOpen=${MODERATION_FAIL_OPEN:-false}'
    depends_on:
      db:
        condition: service_healthy
      moderation:
        condition: service_healthy
    volumes:
      - uploads_data:${UPLOADS_PATH:-/app/wwwroot}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: pgvector/pgvector:pg17
    container_name: tripgenius-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-tripgenius}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
